name = "edgeever"
main = ".wrangler/edgeever-worker/index.js"
compatibility_date = "2026-06-26"
workers_dev = true
no_bundle = true
find_additional_modules = true
base_dir = ".wrangler/edgeever-worker"

[[rules]]
type = "ESModule"
globs = ["modules/*.js"]
fallthrough = true

[build]
command = "bun scripts/build-cloudflare-worker.mjs"
watch_dir = ["apps/api/src", "packages/shared/src"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/.well-known/oauth-protected-resource*", "/.well-known/oauth-authorization-server*", "/.well-known/openid-configuration*", "/__scheduled", "/s/*", "/share/*"]

[[d1_databases]]
binding = "DB"
database_name = "edgeever"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# No R2 binding: when RESOURCES is unbound the Worker stores resource bytes in
# D1 (see apps/api/src/d1-blob-store.ts). To use R2 instead, restore the
# [[r2_buckets]] binding for "edgeever-resources" below and create the bucket;
# deployments that already store bytes in R2 must keep the binding, or their
# existing resources become unreadable until it is restored.
# [[r2_buckets]]
# binding = "RESOURCES"
# bucket_name = "edgeever-resources"
# preview_bucket_name = "edgeever-resources-preview"

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"
